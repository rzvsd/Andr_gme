<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#14181f">
  <title>Hero Lab — Pudd</title>
  <style>
    :root {
      --bg: #14181f;
      --panel: #1c2230;
      --line: #2c3444;
      --text: #e8edf5;
      --muted: #9aa6ba;
      --mint: #9fe1cb;
      --coral: #f0997b;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    body.dark-arena { background: #000; }
    main { max-width: 900px; margin: 0 auto; padding: 12px 12px 48px; }
    .stage { position: relative; aspect-ratio: 800 / 360; background: #000; border-radius: var(--radius); overflow: hidden; }
    #lab-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .stats { position: absolute; top: 8px; right: 10px; font: 12px/1 ui-monospace, monospace; color: var(--muted); display: flex; gap: 12px; }
    .stats b { color: var(--text); }

    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .group { display: flex; gap: 6px; }
    .spacer { flex: 1; }
    button {
      font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 10px 14px; cursor: pointer; touch-action: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { background: var(--line); }
    .pad { min-width: 54px; font-size: 18px; }
    #btn-lights { background: var(--mint); color: #0f2a21; border-color: var(--mint); font-weight: 600; }
    #btn-lights.is-dark { background: #0f2a21; color: var(--mint); }
    .moment { border-color: #3a3f4a; }

    .equip { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 12px; color: var(--muted); font-size: 13px; }
    .equip label { display: flex; align-items: center; gap: 8px; }
    .equip select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
    .equip select:disabled { opacity: 0.4; }

    .tune { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 20px; margin-top: 10px; color: var(--muted); font-size: 13px; }
    .tune label { display: flex; align-items: center; gap: 10px; }
    .tune input { flex: 1; accent-color: var(--mint); }
    .tune output { min-width: 2.5ch; color: var(--text); font-variant-numeric: tabular-nums; }
    .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }

    #bible { margin-top: 28px; }
    .bible-head h2 { margin: 0; font-size: 22px; }
    .bible-head p { margin: 2px 0 14px; color: var(--muted); }
    .bible-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
    .bible-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
    .bible-card h3 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .swatch { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .swatch-name { flex: 1; }
    .chip { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); vertical-align: middle; }
    code { color: var(--muted); font-size: 12px; }
    .sound-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .sound-btn { padding: 6px 10px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="stage">
      <canvas id="lab-canvas" width="800" height="360"></canvas>
      <div class="stats"><span>fps <b id="stat-fps">–</b></span><span>draw calls <b id="stat-calls">–</b></span></div>
    </div>

    <div class="controls">
      <div class="group">
        <button id="btn-left" class="pad" aria-label="Move left">◀</button>
        <button id="btn-right" class="pad" aria-label="Move right">▶</button>
        <button id="btn-jump">Jump</button>
        <button id="btn-shoot">Shoot</button>
      </div>
      <div class="group">
        <button id="btn-hit" class="moment">Hit</button>
        <button id="btn-ko" class="moment">KO</button>
        <button id="btn-win" class="moment">Win</button>
        <button id="btn-taunt" class="moment">Taunt</button>
        <button id="btn-reset" class="moment">Reset</button>
      </div>
      <span class="spacer"></span>
      <button id="btn-lights">Lights off</button>
    </div>

    <div class="equip">
      <label>Body <select id="pick-body"></select></label>
      <label>Hat <select id="pick-hat"></select></label>
      <label>Colors <select id="pick-colors"></select></label>
    </div>

    <div class="tune">
      <label>Wobble <input id="tune-wobble" type="range" min="0" max="2" step="0.1" value="1"><output id="tune-wobble-out">1.0</output></label>
      <label>Breathing <input id="tune-breathing" type="range" min="0" max="3" step="0.1" value="1"><output id="tune-breathing-out">1.0</output></label>
      <label>Squash <input id="tune-squash" type="range" min="0" max="2" step="0.1" value="1"><output id="tune-squash-out">1.0</output></label>
    </div>
    <p class="hint">Keyboard: A/D move · W jump · J shoot. In the dark, only the tells show.</p>

    <div id="bible"></div>
  </main>
  <script type="module" src="/src/hero/heroLab.js"></script>
</body>
</html>
